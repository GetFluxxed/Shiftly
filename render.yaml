services:
  - type: web
    name: shiftly
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: SECURE_COOKIES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: shiftly-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_SIGNUP_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: REPORT_COOLDOWN_SECONDS
        value: "60"

databases:
  - name: shiftly-db
    plan: free
    region: oregon
    databaseName: shiftly
    user: shiftly
