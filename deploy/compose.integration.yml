services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftly_test
      POSTGRES_PASSWORD: shiftly_test
      POSTGRES_DB: shiftly_test
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftly_test -d shiftly_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-restore:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftly_test
      POSTGRES_PASSWORD: shiftly_test
      POSTGRES_DB: shiftly_restore
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftly_test -d shiftly_restore"]
      interval: 2s
      timeout: 5s
      retries: 15
