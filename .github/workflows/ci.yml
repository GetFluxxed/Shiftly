name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shiftly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: shiftly
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U shiftly -d shiftly"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-4o-mini
      DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly
      TEST_DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly
      REPORT_COOLDOWN_SECONDS: "60"
      ADMIN_SIGNUP_KEY: test-admin-key
      HOST: 0.0.0.0
      PORT: "4173"
      SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Check Python sources
        run: python -m compileall -q backend scripts server.py auth.py config.py database.py reporting.py routes.py security.py store_service.py tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run test suite
        run: pytest -q --browser chromium --tracing=retain-on-failure --screenshot=only-on-failure --junitxml=test-results/junit.xml
      - name: Rehearse upgrade, worker recovery, rollback and restore
        env:
          DATABASE_URL: ""
          OPENAI_API_KEY: ""
          REHEARSAL_DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly_rehearsal
          REHEARSAL_RESTORE_DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly_restore
          REHEARSAL_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          REHEARSAL_RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$REHEARSAL_SOURCE_CONTAINER" createdb -U shiftly shiftly_rehearsal
          docker exec "$REHEARSAL_RESTORE_CONTAINER" createdb -U shiftly shiftly_restore
          python scripts/rehearse_release.py | tee release-rehearsal.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-verification-results
          path: |
            test-results/
            release-rehearsal.log
          if-no-files-found: ignore
      - name: Rehearse named accounts upgrade and restore
        env:
          DATABASE_URL: ""
          OPENAI_API_KEY: ""
          ACCOUNTS_REHEARSAL_DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly_accounts_rehearsal
          ACCOUNTS_REHEARSAL_RESTORE_DATABASE_URL: postgresql://shiftly:change-me@localhost:55432/shiftly_accounts_restore
          ACCOUNTS_REHEARSAL_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          ACCOUNTS_REHEARSAL_RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m backend.shiftly.runtime.accounts_rehearsal --create-databases | tee accounts-rehearsal.log
      - name: Upload accounts recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-accounts-recovery
          path: |
            accounts-rehearsal.log
          if-no-files-found: ignore
